name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "-DCMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" "-DCMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG"

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/pup_unpacker dist/pup_unpacker
          tar -C dist -czf pup_unpacker-${{ matrix.artifact }}.tar.gz pup_unpacker

      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/pup_unpacker.exe dist/pup_unpacker.exe
          Compress-Archive -Path dist/pup_unpacker.exe -DestinationPath pup_unpacker-${{ matrix.artifact }}.zip

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pup_unpacker-${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*